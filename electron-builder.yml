appId: ca.workspacealberta.app
productName: WorkspaceAlberta
artifactName: WorkspaceAlberta-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: release

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE.
files:
  - electron/**
  - "!electron/resources/speech-helper"
  - "!electron/resources/perm-helper"
  - "!**/node_modules/**"
  - package.json

asar: true

extraResources:
  - from: dist
    to: ui
  - from: dist-server
    to: server

# Linux is the PRIMARY target for WorkspaceAlberta (Raspberry Pi appliance)
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  icon: build/icon-1024.png
  category: Utility
  synopsis: CEO productivity chat app with AI bots
  description: |
    WorkspaceAlberta is a Linux-first productivity chat app for operators.
    Every bot in the sidebar is a real AI agent backed by Hugging Face
    open-source models, Claude, or Codex — with its own personality,
    model, and optional cloud computer.

deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3
  artifactName: workspacealberta_${version}_${arch}.deb

# macOS support kept as secondary (optional) target
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: WorkspaceAlberta uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: WorkspaceAlberta transcribes your voice on-device to type messages for you.
  notarize: false
  extraResources:
    - from: electron/resources/speech-helper
      to: speech-helper
    - from: electron/resources/perm-helper
      to: perm-helper

dmg:
  sign: true
  artifactName: WorkspaceAlberta-${version}.dmg
