<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">WorkspaceAlberta</title>
  <desc id="desc">A stylized "WA" monogram on a dark pine tile with prairie amber accents.</desc>

  <defs>
    <clipPath id="tile-clip">
      <rect width="1024" height="1024" rx="224" />
    </clipPath>

    <radialGradient id="bg-gradient" cx="30%" cy="20%" r="100%">
      <stop offset="0" stop-color="#142528" />
      <stop offset="0.5" stop-color="#0d1f22" />
      <stop offset="1" stop-color="#071417" />
    </radialGradient>

    <linearGradient id="amber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="0.5" stop-color="#d97706" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="amber-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#fcd34d" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <g clip-path="url(#tile-clip)">
    <rect width="1024" height="1024" fill="url(#bg-gradient)" />

    <!-- Stylized mountains/prairie horizon -->
    <path d="M0 700 L200 520 L350 600 L512 380 L674 600 L824 520 L1024 700 L1024 1024 L0 1024 Z"
          fill="#0a1a1d" opacity="0.6" />

    <!-- "W" letterform - bold, geometric -->
    <g transform="translate(150, 280)">
      <path d="M0 0 L80 0 L160 280 L240 80 L320 280 L400 0 L480 0 L360 400 L280 400 L200 200 L120 400 L40 400 Z"
            fill="url(#amber-gradient)" />
    </g>

    <!-- "A" letterform - triangular, overlapping -->
    <g transform="translate(470, 320)">
      <path d="M200 0 L400 360 L320 360 L280 280 L120 280 L80 360 L0 360 L200 0 Z M200 100 L140 220 L260 220 Z"
            fill="url(#amber-light)" />
    </g>

    <!-- Subtle pine accent line -->
    <rect x="100" y="760" width="824" height="4" rx="2" fill="#2a4448" />

    <!-- Border glow -->
    <rect x="8" y="8" width="1008" height="1008" rx="216" fill="none"
          stroke="url(#amber-gradient)" stroke-opacity="0.3" stroke-width="8" />
  </g>
</svg>
