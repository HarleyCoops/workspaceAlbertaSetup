name: Companion firmware

on:
  pull_request:
    paths:
      - "firmware/companion/**"
      - "scripts/test_companion_layout.py"
      - ".github/workflows/companion-firmware.yml"
  push:
    branches:
      - main
    paths:
      - "firmware/companion/**"
      - "scripts/test_companion_layout.py"
      - ".github/workflows/companion-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run firmware layout checks
        run: python3 scripts/test_companion_layout.py

      - name: Build ESP32-S3 firmware
        working-directory: firmware/companion
        run: |
          idf.py set-target esp32s3
          idf.py build
