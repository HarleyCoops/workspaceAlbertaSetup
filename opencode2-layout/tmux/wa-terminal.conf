# ============================================================================
# WorkspaceAlberta CEO Terminal — tmux layout
# ============================================================================
# Usage: tmux -f ~/.tmux/wa-terminal.conf new-session -A -s wa-terminal
#   or:  bash ~/workspaceAlbertaSetup/opencode2-layout/scripts/start-wa-terminal.sh
# ============================================================================

# General tmux settings
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*:Tc"
set-option -g set-titles on
set-option -g set-titles-string "WA TERMINAL"
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g mouse on
set-option -g history-limit 50000

# Status bar — WorkspaceAlberta branding
set-option -g status-style "bg=#161b22,fg=#c9d1d9"
set-option -g status-left "#[fg=#2E8B57,bold] WA #[fg=#DAA520]TERMINAL "
set-option -g status-right "#[fg=#8b949e]%Y-%m-%d %H:%M #[fg=#2E8B57]#S"
set-option -g status-position top
set-option -g status-interval 30
set-option -g status-justify centre

# Pane borders
set-option -g pane-border-style "fg=#30363d"
set-option -g pane-active-border-style "fg=#2E8B57"
set-option -g display-panes-colour "#2E8B57"
set-option -g display-panes-active-colour "#DAA520"

# ============================================================================
# Window 1: screen1-work — Primary work display (LEFT MONITOR)
# ============================================================================
new-session -d -s wa-terminal -n "screen1-work" -c "$HOME/WorkspaceAlberta"

# Pane 1: procurement agent (top, ~60%)
send-keys "echo '=== WorkspaceAlberta Procurement — opencode2 ==='" Enter
send-keys "# Waiting for opencode2 service to be ready..." Enter
send-keys "sleep 2 && opencode2" Enter

# Pane 2: health/log watch (bottom, ~40%)
split-window -v -p 40 -c "$HOME"
send-keys "echo '=== Health & Log Watch ==='" Enter
send-keys "# Service health check every 30 seconds" Enter
send-keys "watch -n 30 'echo \"--- Service Status ---\"; opencode2 service status 2>/dev/null || echo \"Service not running\"; echo \"\"; echo \"--- Health Check ---\"; opencode2 api get /api/health 2>/dev/null || echo \"API not responding\"'" Enter

# ============================================================================
# Window 2: screen2-status — Status display (RIGHT MONITOR)
# ============================================================================
new-window -n "screen2-status" -c "$HOME"

# Pane 3: browser placeholder / secondary session (top, ~50%)
send-keys "echo '=== Screen 2: Status Display ==='" Enter
send-keys "echo ''" Enter
send-keys "echo 'This pane is a placeholder for:'" Enter
send-keys "echo '  - Chromium browser with CanadaBuys portal'" Enter
send-keys "echo '  - WorkspaceAlberta chat app'" Enter
send-keys "echo '  - GitHub PR/issue views'" Enter
send-keys "echo ''" Enter
send-keys "echo 'Or launch a secondary opencode2 session:'" Enter
send-keys "echo '  opencode2 ~/workspaceAlbertaSetup'" Enter
send-keys "echo ''" Enter
send-keys "echo 'Press Enter to clear and use this pane...'" Enter

# Pane 4: service status / system monitoring (bottom, ~50%)
split-window -v -p 50 -c "$HOME"
send-keys "echo '=== System Monitoring ==='" Enter
send-keys "watch -n 60 'echo \"--- opencode2 service ---\"; opencode2 service status 2>/dev/null || echo \"Not running\"; echo \"\"; echo \"--- System ---\"; uptime; echo \"\"; echo \"--- Tailscale ---\"; tailscale status 2>/dev/null | head -5 || echo \"Not connected\"; echo \"\"; echo \"--- Disk ---\"; df -h / | tail -1'" Enter

# ============================================================================
# Initial selection
# ============================================================================
select-window -t wa-terminal:1
select-pane -t wa-terminal:1.0

# ============================================================================
# Keybinds
# ============================================================================

# Prefix is Ctrl+A (screen-style)
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Window navigation
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2

# Pane navigation (vim-style after prefix)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Quick actions
bind-key C-n new-window -c "#{pane_current_path}"
bind-key C-w kill-window
bind-key r source-file ~/.tmux/wa-terminal.conf \; display "tmux config reloaded"

# Pane resize
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5
